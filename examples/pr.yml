name: PR gate with Jev

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ti
        uses: JevForge/jev-test-intelligence@v0
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          jev_provider: vercel-ai-gateway
          include_history: 'true'
          discover_frameworks: 'true'
          comment_on_github: 'true'
          create_check_run: 'true'
          dry_run: 'true'

      - name: Surface decision
        run: |
          echo "decision=${{ steps.ti.outputs.decision }}"
          echo "confidence=${{ steps.ti.outputs.confidence }}"
          echo "provisional=${{ steps.ti.outputs.provisional }}"
          echo "selected=${{ steps.ti.outputs.selected_test_groups }}"
